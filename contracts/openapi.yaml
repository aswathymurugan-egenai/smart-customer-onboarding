        region: IL
      properties:
        city:
          description: City or town.
          maxLength: 100
          minLength: 1
          title: City
          type: string
        country_code:
          description: ISO 3166-1 alpha-2 country code, upper case.
          pattern: ^[A-Z]{2}$
          title: Country Code
          type: string
        line1:
          description: First address line.
          maxLength: 200
          minLength: 1
          title: Line1
          type: string
        line2:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Second address line, such as a unit number.
          title: Line2
        postal_code:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          description: Postal or ZIP code.
          title: Postal Code
        region:

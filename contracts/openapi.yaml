          - type: 'null'
          description: The form as it stands now.
        last_result:
          anyOf:
          - $ref: '#/components/schemas/LastResult'
          - type: 'null'
          description: The status, problem type, and warnings the form last received.
        message:
          description: The person's message.
          maxLength: 2000
          minLength: 1
          title: Message
          type: string
        session_id:
          description: Conversation id, generated by the client once per session.
          format: uuid
          title: Session Id
          type: string
      required:
      - session_id
      - message
      title: ChatRequest
      type: object
    CustomerDraft:
      additionalProperties: false
      description: 'The form as the person has filled it so far, sent with a chat turn.


        It has the fields of `CustomerInput`, all optional, and no bot token.'
      examples:
      - customer_type: individual
        email: jane.doe@example.test
        family_name: Doe
        given_name: Jane
      properties:
        address:
          anyOf:
          - $ref: '#/components/schemas/AddressDraft'
          - type: 'null'
          description: Postal address so far.
        company_name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Company name.
          title: Company Name
        customer_type:
          anyOf:
          - enum:
            - individual
            - business
            type: string
          - type: 'null'
          description: Whether the customer is a person or a business.
          title: Customer Type
        email:
          anyOf:
          - maxLength: 254
            type: string
          - type: 'null'
          description: Email address.
          title: Email
        family_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Family name.
          title: Family Name
        given_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Given name.
          title: Given Name
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          description: Phone number.
          title: Phone
        tax_id:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          description: Tax or government id.
          title: Tax Id
        tax_id_type:
          anyOf:
          - enum:
            - us_ein
            - gb_vat
            - in_pan
            - other
            type: string
          - type: 'null'
          description: Kind of tax id.
          title: Tax Id Type
      title: CustomerDraft
      type: object
    CustomerInput:
      additionalProperties: false
      description: The values a person submits to register.
      examples:
      - address:
          city: Springfield
          country_code: US
          line1: 100 Example Street
          postal_code: '62701'
          region: IL
        bot_token: local
        customer_type: individual
        email: jane.doe@example.test
        family_name: Doe
        given_name: Jane
        phone: +1 415 555 0100
        tax_id: 12-3456789
        tax_id_type: us_ein
      properties:
        address:
          anyOf:
          - $ref: '#/components/schemas/AddressInput'
          - type: 'null'
          description: Postal address. It improves likely-duplicate matching.
        bot_token:
          default: ''
          description: Proof from the bot check, when one is enforced.
          maxLength: 2048
          title: Bot Token
          type: string
        company_name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          description: Company name. Required for a business and not allowed for an individual.
          title: Company Name
        customer_type:
          default: individual
          description: Whether the customer is a person or a business.
          enum:
          - individual
          - business
          title: Customer Type
          type: string
        email:
          description: Email address. It is the primary unique key.
          maxLength: 254
          minLength: 3
          title: Email
          type: string
        family_name:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Family name. Omit when the person gave one name.
          title: Family Name
        given_name:
          description: Given name or first name.
          maxLength: 100
          minLength: 1
          title: Given Name
          type: string
        phone:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          description: Phone number. Without a country code it is read in the address country.
          title: Phone
        tax_id:
          anyOf:
          - maxLength: 40
            type: string
          - type: 'null'
          description: Tax or government id. Stored as a keyed hash plus its last four characters.
          title: Tax Id
        tax_id_type:
          anyOf:
          - enum:
            - us_ein
            - gb_vat
            - in_pan
            - other
            type: string
          - type: 'null'
          description: Kind of tax or government id. Required when tax_id is given.
          title: Tax Id Type
      required:
      - given_name
      - email
      title: CustomerInput
      type: object
    DuplicateCheckResult:
      additionalProperties: false
      description: The outcome of a duplicate check. It never names another customer.
      examples:
      - advisory_status: ok
        exact_matches:
        - email
      properties:
        advisory_status:
          description: 'Whether the model produced advice: ok, unavailable, or disabled.'
          enum:
          - ok
          - unavailable
          - disabled
          title: Advisory Status
          type: string
        exact_matches:
          description: Which of email, phone, and tax_id already belong to a customer.
          items:
            enum:
            - email
            - phone
            - tax_id
            type: string
          title: Exact Matches
          type: array
        possible_duplicate:
          anyOf:
          - $ref: '#/components/schemas/DuplicateWarning'
          - type: 'null'
          description: A likely-duplicate warning, or null.
      required:
      - exact_matches
      - possible_duplicate
      - advisory_status
      title: DuplicateCheckResult
      type: object
    DuplicateWarning:
      additionalProperties: false
      description: A warning that the applicant may already be a customer under different details.
      examples:
      - code: possible_duplicate
        confidence: 0.82
        message: A customer with a very similar name and address may already exist.
        reasons:
        - swapped_name_order
        - address_variant
      properties:
        code:
          const: possible_duplicate
          default: possible_duplicate
          description: Stable warning code.
          title: Code
          type: string
        confidence:
          description: Model-reported confidence, 0 to 1.
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        message:
          description: Human-readable explanation.
          maxLength: 300
          title: Message
          type: string
        reasons:
          description: Up to three reason codes for the suspicion.
          items:
            enum:
            - name_variant
            - nickname
            - swapped_name_order
            - corporate_alias
            - address_variant
            - shared_business_domain
            type: string
          maxItems: 3
          title: Reasons
          type: array
      required:
      - message
      - confidence
      - reasons
      title: DuplicateWarning
      type: object
    EmailCheckResults:
      additionalProperties: false
      description: The outcome of each email check.
      properties:
        disposable:
          description: Disposable-domain check.
          enum:
          - pass
          - fail
          - unknown
          - skipped
          title: Disposable
          type: string
        mx:
          description: Mail-exchanger lookup.
          enum:
          - pass
          - fail
          - unknown
          - skipped
          title: Mx
          type: string
        syntax:
          description: Syntax check.
          enum:
          - pass
          - fail
          - unknown
          - skipped
          title: Syntax
          type: string
      required:
      - syntax
      - disposable
      - mx
      title: EmailCheckResults
      type: object
    EmailProblem:
      additionalProperties: false
      description: One reason an email address is not acceptable.
      properties:
        code:
          description: Stable problem code.
          maxLength: 100
          title: Code
          type: string
        message:
          description: Human-readable explanation.
          maxLength: 300
          title: Message
          type: string
      required:
      - code
      - message
      title: EmailProblem
      type: object
    EmailValidationRequest:
      additionalProperties: false
      description: The address to check.
      examples:
      - email: jane.doe@example.test
      properties:
        email:
          description: Email address.
          maxLength: 254
          minLength: 3
          title: Email
          type: string
      required:
      - email
      title: EmailValidationRequest
      type: object
    EmailValidationResult:
      additionalProperties: false
      description: The verdict on an email address.
      examples:
      - checks:
          disposable: pass
          mx: pass
          syntax: pass
        email_as_entered: jane@gmial.com
        is_valid: true
        normalized_email: jane@gmial.com
        problems: []
        suggestion:
          code: possible_typo
          message: Did you mean jane@gmail.com?
          source: rules
          suggested_email: jane@gmail.com
      properties:
        checks:
          $ref: '#/components/schemas/EmailCheckResults'
          description: Per-check outcomes.
        email_as_entered:
          description: The address as submitted, trimmed.
          title: Email As Entered
          type: string
        is_valid:
          description: True when no check failed.
          title: Is Valid
          type: boolean
        normalized_email:
          anyOf:
          - type: string
          - type: 'null'
          description: The canonical address, or null when the syntax check failed.
          title: Normalized Email
        problems:
          description: Why the address failed, when it did.
          items:
            $ref: '#/components/schemas/EmailProblem'
          title: Problems
          type: array
        suggestion:
          anyOf:
          - $ref: '#/components/schemas/TypoWarning'
          - type: 'null'
          description: A suggested correction, or null when none applies.
      required:
      - email_as_entered
      - normalized_email
      - is_valid
      - checks
      - problems
      - suggestion
      title: EmailValidationResult
      type: object
    LastResult:
      additionalProperties: false
      description: What the form last received from the API, passed to the assistant for context.
      examples:
      - matched_on:
        - email
        problem_type: urn:smart-customer-onboarding:problem:customer-duplicate
        status: 409
        warnings: []
      properties:
        matched_on:
          description: Fields a 409 named.
          items:
            enum:
            - email
            - phone
            - tax_id
            type: string
          maxItems: 3
          title: Matched On
          type: array
        problem_type:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Problem type URI when the status was an error.
          title: Problem Type
        status:
          description: HTTP status the form last received.
          maximum: 599.0
          minimum: 100.0
          title: Status
          type: integer
        warnings:
          description: Warnings that came with a 201.
          items:
            discriminator:
              mapping:
                possible_duplicate: '#/components/schemas/DuplicateWarning'
                possible_typo: '#/components/schemas/TypoWarning'
              propertyName: code
            oneOf:
            - $ref: '#/components/schemas/TypoWarning'
            - $ref: '#/components/schemas/DuplicateWarning'
          maxItems: 5
          title: Warnings
          type: array
      required:
      - status
      title: LastResult
      type: object
    ProblemDetails:
      additionalProperties: false
      description: An RFC 9457 problem document, served as `application/problem+json`.
      examples:
      - detail: A customer already exists with the same email.
        errors: []
        instance: /api/v1/customers/register
        matched_on:
        - email
        request_id: 7c2f8f3e9b6a4d0c8a1e5b7d9f2a4c6e
        status: 409
        title: Customer already registered
        type: urn:smart-customer-onboarding:problem:customer-duplicate
      properties:
        detail:
          description: Human-readable explanation of this occurrence.
          title: Detail
          type: string
        errors:
          description: Field-level errors, when the problem concerns fields.
          items:
            $ref: '#/components/schemas/ProblemError'
          title: Errors
          type: array
        instance:
          description: Request path the problem occurred on.
          title: Instance
          type: string
        matched_on:
          anyOf:
          - items:
              enum:
              - email
              - phone
              - tax_id
              type: string
            type: array
          - type: 'null'
          description: 'For a duplicate: which keys matched an existing customer.'
          title: Matched On
        request_id:
          description: Request id, also returned in the X-Request-Id header.
          title: Request Id
          type: string
        status:
          description: HTTP status code.
          title: Status
          type: integer
        suggestion:
          anyOf:
          - $ref: '#/components/schemas/TypoWarning'
          - type: 'null'
          description: A suggested correction, where one applies.
        title:
          description: Short, human-readable summary of the problem type.
          title: Title
          type: string
        type:
          description: Stable problem type URI.
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - detail
      - instance
      - request_id
      title: ProblemDetails
      type: object
    ProblemError:
      additionalProperties: false
      description: One field-level error inside a problem document.
      properties:
        code:
          description: Stable error code.
          title: Code
          type: string
        message:
          description: Human-readable explanation.
          title: Message
          type: string
        pointer:
          description: JSON pointer to the offending field, such as `/email`.
          title: Pointer
          type: string
      required:
      - pointer
      - code
      - message
      title: ProblemError
      type: object
    RegistrationCreated:
      additionalProperties: false
      description: The result of a successful registration.
      examples:
      - advisory_status: ok
        customer_id: 0192f6a0-7c1e-7d3b-9a52-5a7d3f6c9e10
        email: jane.doe@example.test
        status: created
        warnings: []
      properties:
        advisory_status:
          description: 'Whether the model produced advice: ok, unavailable, or disabled.'
          enum:
          - ok
          - unavailable
          - disabled
          title: Advisory Status
          type: string
        customer_id:
          description: Identifier of the customer.
          title: Customer Id
          type: string
        email:
          description: The canonical email address stored for the customer.
          title: Email
          type: string
        status:
          const: created
          default: created
          description: Always `created`.
          title: Status
          type: string
        warnings:
          description: Typo and likely-duplicate warnings.
          items:
            discriminator:
              mapping:
                possible_duplicate: '#/components/schemas/DuplicateWarning'
                possible_typo: '#/components/schemas/TypoWarning'
              propertyName: code
            oneOf:
            - $ref: '#/components/schemas/TypoWarning'
            - $ref: '#/components/schemas/DuplicateWarning'
          maxItems: 5
          title: Warnings
          type: array
      required:
      - customer_id
      - email
      - advisory_status
      title: RegistrationCreated
      type: object
    TypoWarning:
      additionalProperties: false
      description: A suggested correction for a likely mistyped email domain.
      examples:
      - code: possible_typo
        message: Did you mean jane@gmail.com?
        source: rules
        suggested_email: jane@gmail.com
      properties:
        code:
          const: possible_typo
          default: possible_typo
          description: Stable warning code.
          title: Code
          type: string
        message:
          description: Human-readable explanation.
          maxLength: 300
          title: Message
          type: string
        source:
          description: Whether a deterministic rule or the model produced the suggestion.
          enum:
          - rules
          - model
          title: Source
          type: string
        suggested_email:
          description: The corrected address.
          maxLength: 254
          title: Suggested Email
          type: string
      required:
      - message
      - suggested_email
      - source
      title: TypoWarning
      type: object
